name: Build VRM RETRO WALK (Windows Standalone)

# This workflow expects the app (package.json, src-tauri/, engine/ ...) at the top of the repository.
# Pyxel is pinned to 3.0.4 because the engine relies on its headless mode.

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python engine & PyInstaller dependencies
        run: python -m pip install --upgrade pip "pyxel==3.0.4" numpy pillow pyinstaller

      - name: Bundle Pyxel 3 headless engine (--onedir)
        run: python scripts/build_engine.py

      - name: Install Tauri CLI and build standalone Windows installer
        run: |
          npm install
          npm run build:standalone

      - uses: actions/upload-artifact@v4
        with:
          name: vrm-retro-walk-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
